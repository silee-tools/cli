name: git-tidy CI

on:
  push:
    paths:
      - 'apps/git-tidy/**'
      - '.github/workflows/git-tidy-ci.yml'
  pull_request:
    paths:
      - 'apps/git-tidy/**'
      - '.github/workflows/git-tidy-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/git-tidy
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          working_directory: apps/git-tidy
      - run: mise run fmt-check
      - run: mise run lint
      - run: mise run test
      - run: mise run build
