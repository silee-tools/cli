name: Commit Lint

# Conventional Commits 강제. PR 의 모든 commit + main push 를 검증한다.
# 절대 원칙: 위반 시 PR merge 차단. main 직접 push 는 force-push 로만 우회 가능.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/check-commit-messages.py
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
      - name: Lint pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          python3 scripts/check-commit-messages.py --from "$BEFORE" --to "${{ github.sha }}"
