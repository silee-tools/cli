name: oma CI

on:
  push:
    paths:
      - 'apps/oma/**'
      - '.mise.toml'
      - '.github/workflows/oma-ci.yml'
  pull_request:
    paths:
      - 'apps/oma/**'
      - '.mise.toml'
      - '.github/workflows/oma-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/oma
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          working_directory: apps/oma
      - name: Install zsh for completion checks
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: mise run fmt-check
      - run: mise run lint
      - run: mise run test
      - run: mise run build
      - run: mise run completion-check
