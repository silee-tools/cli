name: appback CI

on:
  push:
    paths:
      - 'apps/appback/**'
      - '.github/workflows/appback-ci.yml'
  pull_request:
    paths:
      - 'apps/appback/**'
      - '.github/workflows/appback-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/appback
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          working_directory: apps/appback
      - run: mise run fmt-check
      - run: mise run lint
      - run: mise run test
