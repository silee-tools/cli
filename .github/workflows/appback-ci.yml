name: appback CI

on:
  push:
    paths:
      - 'apps/appback/**'
      - '.github/workflows/appback-ci.yml'
  pull_request:
    paths:
      - 'apps/appback/**'
      - '.github/workflows/appback-ci.yml'

jobs:
  test:
    # appback 은 macOS 앱 설정 백업 도구 (Keychain, App Bundle, 사용자 Library
    # 경로 의존). 테스트가 실제 macOS 경로를 다루므로 macOS 러너 필수.
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-latest' }}
    defaults:
      run:
        working-directory: apps/appback
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          working_directory: apps/appback
      - run: mise run fmt-check
      - run: mise run lint
      - run: mise run test
