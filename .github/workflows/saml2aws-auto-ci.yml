name: saml2aws-auto CI

on:
  push:
    paths:
      - 'apps/saml2aws-auto/**'
      - '.mise.toml'
      - '.github/workflows/saml2aws-auto-ci.yml'
  pull_request:
    paths:
      - 'apps/saml2aws-auto/**'
      - '.mise.toml'
      - '.github/workflows/saml2aws-auto-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/saml2aws-auto
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          working_directory: apps/saml2aws-auto
      - name: Install zsh for plugin syntax check
        run: sudo apt-get update && sudo apt-get install -y zsh
        working-directory: .
      - run: mise run fmt-check
      - run: mise run lint
      - run: mise run shell-check
      - run: mise run test
      - run: mise run build
