[tasks.shell-check]
description = "Check zsh plugin syntax"
run = """
zsh -n git-tidy.plugin.zsh
shellcheck -s bash git-tidy.plugin.zsh
"""

[tasks.test]
description = "Run tests (zsh-only tool: syntax check)"
run = """
zsh -n git-tidy.plugin.zsh
shellcheck -s bash git-tidy.plugin.zsh
"""

[tasks.install]
description = "Install zsh plugin to local XDG data path"
run = """
set -euo pipefail
data_home="${XDG_DATA_HOME:-$HOME/.local/share}"
mkdir -p "$data_home/git-tidy"
cp git-tidy.plugin.zsh "$data_home/git-tidy/git-tidy.plugin.zsh"
echo "Installed $data_home/git-tidy/git-tidy.plugin.zsh"
"""

[tasks.uninstall]
description = "Remove local zsh plugin"
run = """
data_home="${XDG_DATA_HOME:-$HOME/.local/share}"
rm -f "$data_home/git-tidy/git-tidy.plugin.zsh"
rmdir "$data_home/git-tidy" 2>/dev/null || true
echo "Removed $data_home/git-tidy/git-tidy.plugin.zsh"
"""
