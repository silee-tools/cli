version: 2

project_name: saml2aws-auto

# 모노레포: 태그 prefix `saml2aws-auto/` 와 디렉토리 매핑.
# 루트에서 `goreleaser release -f apps/saml2aws-auto/.goreleaser.yaml` 호출 시 활성.
monorepo:
  tag_prefix: saml2aws-auto/
  dir: apps/saml2aws-auto

builds:
  - main: ./cmd/saml2aws-auto-login
    binary: saml2aws-auto-login
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"

# release-please 가 GitHub Release 객체를 만들고, 우리는 dist/ 에 산출물만 둔다.
# 이후 release-please.yml 의 다음 step 이 gh release upload 로 첨부.
release:
  disable: true
