version: 2

project_name: jg


builds:
  - main: ./cmd/jg
    binary: jg
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - completions/*
      - plugin/*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"

# release-please 가 GitHub Release 객체를 만들고, 우리는 dist/ 에 산출물만 둔다.
# 이후 release-please.yml 의 다음 step 이 gh release upload 로 첨부.
release:
  disable: true
