[tools]
go = "1.23"
"aqua:golangci/golangci-lint" = "latest"

[tasks.build]
description = "Build the project"
run = "go build ./cmd/jg"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.lint]
description = "Run linter"
run = "golangci-lint run"

[tasks.fmt]
description = "Format code"
run = "gofmt -w ."

[tasks.fmt-check]
description = "Check formatting (CI)"
run = "test -z \"$(gofmt -l .)\""

[tasks.install]
description = "Build and install to ~/.local/bin (jg + jgw symlink)"
run = """
go build -o ~/.local/bin/jg ./cmd/jg
ln -sf ~/.local/bin/jg ~/.local/bin/jgw
"""

[tasks.uninstall]
description = "Remove local dev build, revert to brew version"
run = """
rm -f ~/.local/bin/jg ~/.local/bin/jgw
echo "Removed ~/.local/bin/jg and ~/.local/bin/jgw — now using brew version"
"""

[tasks.release]
description = "Dispatch release-please.yml to rebuild an existing jg release"
raw = true
run = "bash scripts/release.sh"
