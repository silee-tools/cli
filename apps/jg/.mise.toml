[tools]
go = "1.23"
"aqua:golangci/golangci-lint" = "latest"

[tasks.build]
description = "Build the project"
run = "go build ./cmd/jg"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.lint]
description = "Run linter"
run = "golangci-lint run"

[tasks.fmt]
description = "Format code"
run = "gofmt -w ."

[tasks.fmt-check]
description = "Check formatting (CI)"
run = "test -z \"$(gofmt -l .)\""

[tasks.install]
description = "Build and install to ~/.local/bin (jg + jgw symlink)"
run = """
set -eu
mkdir -p "$HOME/.local/bin"

state_path=""
if command -v brew >/dev/null 2>&1; then
  prefix="$(brew --prefix)"
  state_path="$prefix/var/silee-tools/jg/active-channel"
fi

target="$HOME/.local/bin/jg"
tmp="$(mktemp "$HOME/.local/bin/.jg.XXXXXX")"
state_tmp=""
binary_backup=""
binary_installed=0
cleanup() {
  if [ "$binary_installed" -eq 1 ]; then
    if [ -n "$binary_backup" ]; then
      mv "$binary_backup" "$target"
      binary_backup=""
    else
      rm -f "$target"
    fi
    binary_installed=0
  fi
  rm -f "$tmp"
  [ -z "$state_tmp" ] || rm -f "$state_tmp"
  [ -z "$binary_backup" ] || rm -f "$binary_backup"
}
trap cleanup EXIT HUP INT TERM
if [ -n "$state_path" ]; then
  go build -ldflags "-X=main.runtimeStatePath=$state_path" -o "$tmp" ./cmd/jg
else
  go build -o "$tmp" ./cmd/jg
fi

if [ -n "$state_path" ]; then
  mkdir -p "$(dirname "$state_path")"
  state_tmp="$(mktemp "$(dirname "$state_path")/.active-channel.XXXXXX")"
  printf 'channel=dev\n' >"$state_tmp"
fi

if [ -f "$target" ]; then
  binary_backup="$(mktemp "$HOME/.local/bin/.jg.backup.XXXXXX")"
  cp -p "$target" "$binary_backup"
fi
mv "$tmp" "$target"
tmp=""
binary_installed=1

if [ -n "$state_path" ]; then
  mv "$state_tmp" "$state_path"
  state_tmp=""
fi
binary_installed=0
rm -f "$binary_backup"
binary_backup=""
ln -sfn "$HOME/.local/bin/jg" "$HOME/.local/bin/jgw"
"""

[tasks.uninstall]
description = "Remove local dev build, revert to brew version"
run = """
rm -f ~/.local/bin/jg ~/.local/bin/jgw
echo "Removed ~/.local/bin/jg and ~/.local/bin/jgw — now using brew version"
"""

[tasks.release]
description = "Dispatch release-please.yml to rebuild an existing jg release"
raw = true
run = "bash scripts/release.sh"
