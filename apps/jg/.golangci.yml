# 원본 silee-tools/jg 레포는 golangci-lint 를 강제하지 않았음(repo 에 .golangci.yml
# 없음, CI 에서도 호출 안 함). 모노레포 이주 시 동일 정책을 유지하기 위해
# errcheck 전체를 비활성화한다. 다른 lint rule (go vet, ineffassign, staticcheck
# 등) 은 그대로 enforce.
# 새 코드에서 errcheck 가 필요해지면 추후 enable.
version: "2"
linters:
  default: standard
  disable:
    - errcheck
