# 원본 silee-tools/jg 레포는 golangci-lint 를 강제하지 않았음. 모노레포 이주 시
# 동일한 정책을 유지하기 위해 errcheck 의 defer Close() 케이스만 면제.
# 새 코드부터는 errcheck 정상 적용된다.
version: "2"
linters:
  default: standard
  exclusions:
    rules:
      - linters: [errcheck]
        text: 'Error return value of `.+\.Close` is not checked'
