[tools]
bun = "latest"

[tasks.build]
description = "Build the project"
run = "bun build src/cli.ts --outdir dist --target bun"

[tasks.test]
description = "Run tests (skip when no test files)"
# bun test 가 'No tests found' 일 때 exit 1 을 내므로 테스트 파일 존재 여부를 먼저 확인.
run = """
if find . -path ./node_modules -prune -o \\( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \\) -print | grep -q .; then
  bun test
else
  echo 'no test files — skip'
fi
"""

[tasks.lint]
description = "Run linter"
run = "bun x biome check ."

[tasks.fmt]
description = "Format code"
run = "bun x biome format --write ."

[tasks.fmt-check]
description = "Check formatting (CI)"
run = "bun x biome format ."
